# Example nginx front for production. Only Next.js (port 3000) is public; the API stays on 127.0.0.1:4000.
server {
  listen 443 ssl http2;
  server_name www.your-domain.com;
  # ssl_certificate / ssl_certificate_key ...

  client_max_body_size 32k;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    # Overwrite (do not append) so clients cannot spoof their IP for rate limiting.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
server { listen 80; server_name www.your-domain.com; return 301 https://$host$request_uri; }
